<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#16171B"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>江味齋 POS</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icons/icon-192.png"/>
<style>
:root{--bg:#16171B;--panel:#1E2026;--card:#272A32;--card2:#30343E;--line:#3A3F4B;--text:#F2F3F5;--muted:#9AA1AE;--red:#D9442F;--red-d:#B03524;--green:#2FA36B;--amber:#E9A23B;--blue:#4C8DF6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;user-select:text;-webkit-user-select:text}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{font-weight:800;font-size:18px;margin-right:8px;white-space:nowrap}.brand b{color:var(--red)}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.nav button{padding:8px 14px;border-radius:8px;min-height:44px;white-space:nowrap;color:var(--muted);font-weight:600}
.nav button.on{background:var(--card2);color:var(--text)}
.nav small{display:block;font-size:13px;font-weight:500;opacity:.9}
.clock{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.main{flex:1;min-height:0;display:flex}
.left{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;flex-shrink:0}
.cats button{padding:10px 16px;border-radius:999px;background:var(--card);white-space:nowrap;min-height:44px;font-weight:600}
.cats button.on{background:var(--red)}
.tools{display:flex;gap:6px;flex-shrink:0;margin-left:6px}
.so{padding:8px 12px;border-radius:8px;min-height:44px;font-weight:600;white-space:nowrap;border:1px dashed var(--line);color:var(--muted)}
.so small{display:block;font-size:12px}
.so.on{background:var(--amber);color:#111;border-style:solid}
.tip{margin:0 10px 6px;padding:8px 12px;border-radius:8px;background:var(--amber);color:#111;font-weight:700;font-size:15px}
.cartbar{display:none}.sheetBack{display:none}
.grid{flex:1;overflow-y:auto;padding:4px 10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;align-content:start;grid-auto-rows:max-content}
.item{background:var(--card);border-radius:12px;padding:10px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;border:1px solid transparent;position:relative}
.item:active{background:var(--card2);border-color:var(--red)}
.item{cursor:pointer}
.item .zh{font-weight:700;font-size:17px;line-height:1.25}
.item .en{font-size:15.5px;font-weight:600;color:#C9CED8;line-height:1.25;margin-top:3px}
.item .code{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:15px;border-radius:6px;padding:1px 8px;margin-bottom:5px}
.cats small{font-size:14px;font-weight:600}
.cd{color:var(--amber);font-weight:800;margin-right:4px}
.item .pr{font-weight:700;color:var(--amber);margin-top:6px}
.item .ph{width:calc(100% + 20px);margin:-10px -10px 8px;height:104px;object-fit:cover;border-radius:12px 12px 0 0;display:block;background:var(--card2)}
.item.has{border-color:var(--green);background:#22302B}
.step{display:none;align-items:center;gap:6px;margin-top:8px}
.item.has .step{display:flex}.item.has .pr{display:none}
.step button{flex:1;height:48px;border-radius:10px;font-size:26px;font-weight:800}
.step .minus{background:var(--red);color:#fff}.step .plus{background:var(--green);color:#fff}
.step b{min-width:40px;text-align:center;font-size:24px}
.noteBtn{display:none;width:100%;margin-top:6px;min-height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;padding:6px 8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.has .noteBtn{display:block}.noteBtn.set{background:var(--amber);color:#111;border-color:var(--amber)}
.nb{flex-shrink:0;min-width:54px;min-height:46px;border-radius:8px;background:var(--card2);font-size:18px;padding:2px 6px}
.nb small{display:block;font-size:12px;font-weight:600}.nb.set{background:var(--amber);color:#111}
.step small{display:block;font-size:12px;font-weight:600;color:var(--amber);text-align:center}
.item .new{display:inline-block;background:var(--amber);color:#111;font-weight:800;font-size:12px;border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:top}
.item.addnew{align-items:center;justify-content:center;border:2px dashed var(--line);background:none;color:var(--muted);font-weight:700;text-align:center}
.grid{padding-top:10px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px}
.item.sold{opacity:.45}.item.sold::after{content:"售完 Sold out";position:absolute;right:8px;bottom:8px;font-size:11px;background:var(--line);padding:2px 6px;border-radius:6px}
.right{width:380px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.meta{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--card);border-radius:8px;overflow:hidden;grid-column:1/3}
.seg button{flex:1;padding:8px;min-height:44px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.lines{flex:1;overflow-y:auto;padding:6px 8px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
.ln{display:flex;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.ln .info{flex:1;min-width:0;text-align:left}
.ln .nm{font-weight:600}.ln .sub{font-size:14.5px;color:var(--muted);line-height:1.35}.ln .sub.m{color:var(--amber)}
.ln .amt{font-weight:700;white-space:nowrap}
.qb{width:46px;height:46px;border-radius:8px;background:var(--card2);font-size:22px;font-weight:700;flex-shrink:0}
.q{min-width:22px;text-align:center;font-weight:700}
.tot{border-top:1px solid var(--line);padding:8px 10px}
.tot div{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:1px 0}
.tot .big{font-size:22px;font-weight:800;color:var(--text)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 8px 8px}
.btn{background:var(--card2);border-radius:10px;padding:10px 8px;min-height:48px;font-weight:600;text-align:center}
.btn small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.btn.pri{background:var(--red);color:#fff}.btn.pri:active{background:var(--red-d)}
.btn.ok{background:var(--green);color:#fff}.btn.warn{background:var(--amber);color:#111}.btn.ghost{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.payrow{display:flex;gap:6px;padding:0 8px 8px}.pay{flex:1;font-size:18px;min-height:64px}
.page{flex:1;overflow-y:auto;padding:14px;max-width:1100px;width:100%;margin:0 auto}
.page h2{margin:4px 0 12px;font-size:20px}.page h3{margin:18px 0 8px;font-size:16px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cardb{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--card);border-radius:10px;padding:10px}.kpi span{font-size:12px;color:var(--muted);display:block}.kpi b{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);margin-right:4px}
.tag.void{background:var(--red);color:#fff}
.ord{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.ord.void{opacity:.6}
.ord .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ord .d{font-size:13px;color:var(--muted);margin:4px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
#modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(560px,100%);max-height:94vh;overflow-y:auto}
.box.wide{width:min(760px,100%)}
.box h3{margin:0 0 12px;font-size:18px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:10px 14px;border-radius:999px;background:var(--card);min-height:44px;font-weight:600;border:1px solid var(--line)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.foot{display:flex;gap:8px;margin-top:14px}.foot .btn{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{background:var(--card2);border-radius:10px;min-height:56px;font-size:22px;font-weight:700}
.disp{background:var(--card);border-radius:10px;padding:10px 14px;font-size:28px;font-weight:800;text-align:right;min-height:56px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.payg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum{display:flex;justify-content:space-between;padding:3px 0}.sum.big{font-size:22px;font-weight:800}
.change{font-size:40px;font-weight:800;color:var(--green);text-align:center;margin:8px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.on{opacity:.92}
.prev{background:#fff;border-radius:6px;max-width:100%;display:block;margin:0 auto 8px}
.pinDots{font-size:30px;letter-spacing:10px;text-align:center;min-height:44px}
@media (max-width:1100px){.right{width:340px}}
/* 窄螢幕（直放或小平板）：菜單佔滿畫面，訂單收在底部長條，點開變整頁 */
@media (max-width:899px){
  .clock,.brand{display:none}
  .right{position:fixed;inset:0;width:100%;z-index:5;border:none;display:none}
  .main.open .right{display:flex}
  .sheetBack{display:block;margin:8px;padding:12px;border-radius:10px;background:var(--card2);font-weight:700;font-size:16px;min-height:52px}
  .cartbar{display:flex;gap:8px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);flex-shrink:0}
  .cartbar .btn{flex:1;min-height:60px;font-size:17px}
  .payg{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ============ 江味齋 POS：單機、離線、資料存在本機 IndexedDB；列印走 RawBT（圖片） ============ */
const APP_VER="1.8.0";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const R=c=>{const n=(c||0)/100;return (n<0?"-R":"R")+(Number.isInteger(n)?Math.abs(n):Math.abs(n).toFixed(2));};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const tstr=ts=>{const d=new Date(ts);return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;};
const dtstr=ts=>{const d=new Date(ts);return `${dkey(d)} ${tstr(ts)}`;};
const toCents=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?Math.round(n*100):NaN;};
const hash=s=>{let h=2166136261;const t="jwpos:"+s;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);};
const isAndroid=/Android/i.test(navigator.userAgent);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2200);}

/* ---------- 資料庫 ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("jwpos",1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("kv");d.createObjectStore("orders",{keyPath:"id"}).createIndex("dateKey","dateKey");};
    r.onsuccess=()=>{DB.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=DB.db.transaction(store,mode);let rq;try{rq=fn(t.objectStore(store));}catch(e){rej(e);return;}
    t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=t.onabort=()=>rej(t.error||new Error("db"));});},
  get:k=>DB.tx("kv","readonly",s=>s.get(k)),
  set:(k,v)=>DB.tx("kv","readwrite",s=>s.put(v,k)),
  putOrder:o=>DB.tx("orders","readwrite",s=>s.put(o)),
  getOrder:id=>DB.tx("orders","readonly",s=>s.get(id)),
  byDate:k=>DB.tx("orders","readonly",s=>s.index("dateKey").getAll(k)),
  all:()=>DB.tx("orders","readonly",s=>s.getAll()),
  clearOrders:()=>DB.tx("orders","readwrite",s=>s.clear()),
};

/* ---------- 預設資料（菜單取自點餐 App 2026-11 版本，之後各自獨立維護）---------- */
function seedMenu(){
  const C=[["c1","B","便當類","Bento (with 3 side dishes)",[["排骨飯","Fry Pork Chop Bento",130],["素食飯","Vegetarian Bento",130],["肉羹飯","Pork Thick Soup Rice Bento",130],["滷排飯","Braised Pork Chop Bento",140],["控肉飯","Braised Pork Belly Bento",140],["雞排飯","Fry Chicken Cutlet Bento",140],["蜜汁雞飯","Honey Glazed Chicken Bento",140],["椒麻雞飯","TW Pepper Chicken Bento",140],["刷醬雞排飯","Brushed Fry Chicken Bento",140]]],
  ["c2","A","單點","A La Carte",[["蔥油餅＋蛋（胡椒鹽）","Scallion Egg Crepe (Pepper Salt)",45],["炒青菜","Stir-fried Vegetables",50],["炸甜不辣","Fried Fish Cakes",50],["香滷米血","Braised Blood Rice Cake",50],["蔥油餅＋蛋（刷醬）","Scallion Egg Crepe (Sauced)",50],["炸花枝丸","Fried Squid Balls",55],["炸芋籤","Fry Taro Cube",65],["滷肉飯","Braised Pork Mince Rice",75],["鹽酥雞","Popcorn Chicken",90],["刷醬雞排","Brushed Sauce Chicken Cutlet",90],["蜜汁雞排","Honey Glazed Chicken Cutlet",90],["肉羹湯","Pork Thick Soup",100]]],
  ["c3","N","麵類","Noodle",[["肉羹麵","Pork Thick Soup Noodle",130],["榨菜肉絲麵","Shredded Pork & Pickled Veg Noodle",130],["滷排麵","Braised Pork Chop Noodle",140]]],
  ["c4","D","飲料","Drinks",[["麥香紅茶","Wheat Black Tea",20],["麥香奶茶","Wheat Milk Tea",20],["阿薩姆奶茶","Assam Milk Tea",20],["冬瓜茶","Winter Melon Tea",30],["猛將椰奶","Coconut Milk Drink",30],["黑松沙士","Heysong Sarsaparilla",30],["可爾必思","Calpis",30],["蘋果西打","Apple Cider Soda",30]]]];
  const cats=[],items=[];
  C.forEach(([id,code,name,nameEn,list])=>{cats.push({id,code,name,nameEn});list.forEach(([n,e,p],i)=>items.push({id:id+"_"+i,code:code+(i+1),catId:id,name:n,nameEn:e,price:p*100,soldOut:false}));});
  const mods=[["加辣","Spicy"],["不辣","Not spicy"],["去蔥","No scallion"],["去香菜","No coriander"],["飯少","Less rice"]].map(([name,nameEn],i)=>({id:"m"+i,name,nameEn,price:0,catIds:[]}));
  return {cats,items,mods};
}
const DEF_SETTINGS={shopName:"江味齋",shopEn:"JiangWay",addr:"",phone:"",footer:"謝謝光臨 Thank you!",pin:"",autoPrint:true,printMode:"both",discPin:false,sources:["現場 Walk-in","電話 Phone","WhatsApp","Gogobear"]};
const TYPES=[["外帶","Takeaway"],["內用","Dine-in"]];
const METHODS=[["cash","現金","Cash"],["card","刷卡","Card"],["eft","EFT","Transfer"],["voucher","餐券","Voucher"]];
const mName=k=>{const m=METHODS.find(x=>x[0]===k);return m?(k==="eft"?"EFT":m[1]+" "+m[2]):k;};
/* 品項編號：類別代碼（B、A、N、D…）＋流水號；編號存在品項上，刪除別的品項不會讓它變號 */
const nm=l=>(l.code?l.code+" ":"")+l.name;
function nextCode(catId){const c=S.menu.cats.find(x=>x.id===catId),pre=(c&&c.code)||"";let n=0;
  S.menu.items.forEach(i=>{if(i.catId===catId){const m=String(i.code||"").match(/(\d+)$/);if(m)n=Math.max(n,+m[1]);}});
  let code;do{n++;code=pre+n;}while(S.menu.items.some(i=>i.code===code));return code;}
function ensureCodes(){let ch=false;const used=new Set(S.menu.cats.map(c=>c.code).filter(Boolean));
  S.menu.cats.forEach(c=>{if(!c.code){let k=0,code;do{code=String.fromCharCode(65+k%26)+(k>=26?Math.floor(k/26):"");k++;}while(used.has(code));used.add(code);c.code=code;ch=true;}});
  S.menu.items.forEach(i=>{if(!i.code){i.code=nextCode(i.catId);ch=true;}});
  if(!S.menu.imgSeeded){S.menu.items.forEach(i=>{if(SEED_IMG[i.id]&&!i.photo&&i.img===undefined)i.img=SEED_IMG[i.id];});S.menu.imgSeeded=true;ch=true;}
  return ch;}
/* 新品：品項標「新品」後出現在最前面的「⭐ 新品」分頁，30 天後自動移除（品項仍留在原類別） */
const NEW_DAYS=30,isNewNow=i=>!!i.isNew&&Date.now()-(i.newAt||0)<NEW_DAYS*864e5;
/* 照片：photo＝店主在平板上傳（壓縮後存本機）；img＝隨 App 附的照片檔名 */
const itemImg=i=>i.photo||(i.img?"img/"+i.img+".webp":"");
const SEED_IMG={c1_0:"real-b1",c1_3:"real-b2",c1_7:"real-b4",c1_4:"real-b5",c2_8:"real-a7",c2_0:"congyoubing",c4_1:"milktea"};
function compressPhoto(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{try{const E=400,c=document.createElement("canvas");c.width=c.height=E;const sd=Math.min(img.naturalWidth,img.naturalHeight);
    c.getContext("2d").drawImage(img,(img.naturalWidth-sd)/2,(img.naturalHeight-sd)/2,sd,sd,0,0,E,E);
    let out=c.toDataURL("image/webp",0.72);if(out.indexOf("data:image/webp")!==0)out=c.toDataURL("image/jpeg",0.72);res(out);}catch(e){rej(e);}finally{URL.revokeObjectURL(u);}};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("無法讀取這張圖片"));};img.src=u;});}
/* 從點餐 App 帶入更新：只「讀」點餐 App 公開的菜單資料（新品、新類別、照片），不會寫回去，也不動 POS 自己的價格與訂單。
   需要網路；平常收銀仍然完全離線。 */
const APP_DB="https://jiangway-bk-end-management-default-rtdb.asia-southeast1.firebasedatabase.app";
const APP_ID={b1:"c1_0",b8:"c1_1",b9:"c1_2",b2:"c1_3",b5:"c1_4",b6:"c1_5",b3:"c1_6",b4:"c1_7",b7:"c1_8",a1:"c2_0",a10:"c2_1",a3:"c2_2",a12:"c2_3",a2:"c2_4",a4:"c2_5",a5:"c2_6",a6:"c2_7",a7:"c2_8",a8:"c2_9",a9:"c2_10",a11:"c2_11",n1:"c3_0",n2:"c3_1",n3:"c3_2",d1:"c4_0",d2:"c4_1",d9:"c4_2",d11:"c4_3",d4:"c4_4",d5:"c4_5",d8:"c4_6",d10:"c4_7"};
const APP_CAT=[[/^便當/,"c1"],[/^單點/,"c2"],[/^麵/,"c3"],[/^飲料/,"c4"]];
const PHOTO_RE=/^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+\/]+={0,2}$/;
const okPhoto=p=>typeof p==="string"&&p.length<=200000&&PHOTO_RE.test(p);
async function syncFromApp(quiet){
  const get=async n=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);try{const r=await fetch(APP_DB+"/"+n+".json",{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return (await r.json())||{};}finally{clearTimeout(t);}};
  let cats,customs,ovr;
  try{[cats,customs,ovr]=await Promise.all(["categories","custom_items","menu_overrides"].map(get));}
  catch(e){if(!quiet)toast("無法連到點餐 App（請確認平板有網路）");return null;}
  const m=S.menu,res={cats:0,items:0,photos:0};
  const str=(v,n)=>String(v==null?"":v).slice(0,n);
  // 1) 點餐 App 新增的類別
  const catOf=key=>{key=String(key||"");const hit=m.cats.find(c=>c.appKey===key);if(hit)return hit.id;
    for(const [re,id] of APP_CAT)if(re.test(key)&&m.cats.some(c=>c.id===id))return id;return null;};
  Object.values(cats).filter(c=>c&&!c.builtin&&!c.hidden&&c.key).sort((a,b)=>(a.order||0)-(b.order||0)).forEach(c=>{
    if(m.cats.some(x=>x.appKey===c.key))return;
    const same=m.cats.find(x=>x.name===str(c.nameZh,20));
    if(same){same.appKey=c.key;return;}
    m.cats.push({id:uid(),code:"",name:str(c.nameZh||c.key,20),nameEn:str(c.nameEn,40),appKey:c.key});res.cats++;});
  ensureCodes();
  // 2) 點餐 App 後台新增的品項（30 天內的算新品）
  Object.values(customs).filter(c=>c&&c.id&&c.name&&!c.hidden&&Number(c.price)>0).forEach(c=>{
    const ph=okPhoto(c.photo)?c.photo:"";let it=m.items.find(x=>x.appId===c.id);
    if(!it){const catId=catOf(c.category)||(m.cats[0]&&m.cats[0].id);if(!catId)return;const created=Number(c.createdAt)||Date.now();
      it={id:uid(),appId:c.id,code:"",catId,name:str(c.name,40),nameEn:str(c.nameEn,60),price:Math.round(Number(c.price)*100),soldOut:false,isNew:true,newAt:created,photo:ph,photoFrom:ph?"app":""};
      it.code=nextCode(catId);m.items.push(it);res.items++;if(ph)res.photos++;}
    else if(ph&&it.photoFrom!=="none"&&(!it.photo||it.photoFrom==="app")&&it.photo!==ph){it.photo=ph;it.photoFrom="app";res.photos++;}});
  // 3) 原有品項在點餐 App 換上的照片（POS 上自己拍的照片不會被蓋掉）
  Object.entries(ovr).forEach(([aid,o])=>{const it=m.items.find(x=>x.id===APP_ID[aid]);if(!it||!o||!okPhoto(o.photo))return;
    if(it.photoFrom!=="none"&&(!it.photo||it.photoFrom==="app")&&it.photo!==o.photo){it.photo=o.photo;it.photoFrom="app";res.photos++;}});
  m.appSyncedAt=Date.now();await save.menu();
  if(!quiet||res.cats||res.items||res.photos)toast(`已從點餐 App 更新：新類別 ${res.cats}、新品項 ${res.items}、照片 ${res.photos}`);
  return res;
}

/* ---------- 金額計算（單位：分；折扣四捨五入到整 Rand，避免找零出現小數）---------- */
const discAmt=(d,base)=>!d||!d.val?0:Math.min(base,d.kind==="pct"?Math.round(base*d.val/10000)*100:d.val);
function lineCalc(l){const unit=l.price+l.mods.reduce((s,m)=>s+m.price,0);const gross=unit*l.qty;const disc=discAmt(l.disc,gross);return {unit,gross,disc,net:gross-disc};}
function calc(c){let gross=0,lineDisc=0;c.lines.forEach(l=>{const x=lineCalc(l);gross+=x.gross;lineDisc+=x.disc;});
  const sub=gross-lineDisc;const orderDisc=discAmt(c.disc,sub);return {gross,lineDisc,sub,orderDisc,disc:lineDisc+orderDisc,total:sub-orderDisc,qty:c.lines.reduce((s,l)=>s+l.qty,0)};}
const discLabel=d=>!d||!d.val?"":d.kind==="pct"?d.val+"%":R(d.val);

let MH={};
function modal(html,handlers,wide){MH=handlers||{};const m=$("#modal");m.innerHTML=`<div class="box${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div>`;m.classList.add("on");}
function closeModal(){MH={};const m=$("#modal");m.classList.remove("on");m.innerHTML="";}
function confirmBox(msg,okLabel="確定 OK"){return new Promise(res=>modal(`<h3>${esc(msg)}</h3><div class="foot"><button class="btn ghost" data-act="no">取消 Cancel</button><button class="btn pri" data-act="yes">${esc(okLabel)}</button></div>`,{no(){closeModal();res(false);},yes(){closeModal();res(true);}}));}
function pinPad(title){return new Promise(res=>{let v="";
  const draw=()=>modal(`<h3>${esc(title)}</h3><div class="pinDots">${"●".repeat(v.length)||"&nbsp;"}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="k" data-k="${n}">${n}</button>`).join("")}<button data-act="x">取消</button><button data-act="k" data-k="0">0</button><button data-act="bk">⌫</button></div><div class="foot"><button class="btn pri" data-act="ok">確定 OK</button></div>`,
    {k(el){if(v.length<8){v+=el.dataset.k;draw();}},bk(){v=v.slice(0,-1);draw();},x(){closeModal();res(null);},ok(){closeModal();res(v);}});
  draw();});}
async function needPin(){

    const a=await pinPad("第一次使用：請設定店主 PIN（4–8 位數）");if(a===null)return false;

    S.settings.pin=hash(a);await save.settings();toast("已設定店主 PIN");return true;
  }

/* 通用表單：fields=[{k,label,type:text|number|select|checks|toggle,value,options:[[val,label]]}] */
function form(title,fields,okLabel="儲存 Save",extraBtn){return new Promise(res=>{
  const vals={};
  form._onPhoto=async(k,file)=>{if(!file)return;try{vals[k]=await compressPhoto(file);const im=document.getElementById("f_"+k+"_prev");if(im){im.src=vals[k];im.style.display="";}}catch(e){toast("照片處理失敗："+(e&&e.message||e));}};
  const fh=f=>{const id="f_"+f.k;
    if(f.type==="select")return `<select id="${id}">${f.options.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(f.value)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
    if(f.type==="checks")return `<div class="chips" id="${id}">${f.options.map(([v,l])=>`<button type="button" class="chip${(f.value||[]).includes(v)?" on":""}" data-act="tg" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div>`;
    if(f.type==="photo"){vals[f.k]=f.value||"";return `<div class="row" id="${id}"><img id="${id}_prev" class="thumb" style="width:84px;height:84px;${f.value?"":"display:none"}" src="${esc(f.value||"")}" alt=""/><label class="btn" style="padding:10px 14px;cursor:pointer">選擇照片／拍照 Photo<input type="file" accept="image/*" data-photo="${f.k}" style="display:none"/></label><button type="button" class="btn ghost" style="padding:10px 14px" data-act="phRm" data-k="${f.k}">移除照片</button></div>`;}
    if(f.type==="toggle")return `<div class="chips" id="${id}"><button type="button" class="chip${f.value?" on":""}" data-act="tg1" data-v="1">開 On</button><button type="button" class="chip${!f.value?" on":""}" data-act="tg1" data-v="0">關 Off</button></div>`;
    return `<input id="${id}" type="${f.type==="number"?"number":"text"}" ${f.type==="number"?'inputmode="decimal" step="any" min="0"':""} value="${esc(f.value??"")}" maxlength="${f.max||80}" placeholder="${esc(f.ph||"")}"/>`;};
  modal(`<h3>${esc(title)}</h3>${fields.map(f=>`<div class="f"><label for="f_${f.k}">${esc(f.label)}</label>${fh(f)}</div>`).join("")}<div class="foot"><button class="btn ghost" data-act="x">取消 Cancel</button>${extraBtn?`<button class="btn ghost" data-act="extra">${esc(extraBtn)}</button>`:""}<button class="btn pri" data-act="ok">${esc(okLabel)}</button></div>`,{
    tg(el){el.classList.toggle("on");},
    phRm(el){vals[el.dataset.k]="";const im=document.getElementById("f_"+el.dataset.k+"_prev");if(im)im.style.display="none";},
    tg1(el){[...el.parentNode.children].forEach(c=>c.classList.toggle("on",c===el));},
    x(){closeModal();res(null);},extra(){closeModal();res({_extra:true});},
    ok(){const out={};fields.forEach(f=>{const el=document.getElementById("f_"+f.k);
      if(f.type==="photo")out[f.k]=vals[f.k];
      else if(f.type==="checks")out[f.k]=[...el.querySelectorAll(".chip.on")].map(c=>c.dataset.v);
      else if(f.type==="toggle")out[f.k]=el.querySelector(".chip.on").dataset.v==="1";
      else out[f.k]=el.value.trim();});closeModal();res(out);}
  });});}

function payBox(total,title,onPaid){
  const pays=[];let entry="",busy=false;
  const paid=()=>pays.reduce((s,p)=>s+p.amount,0),remain=()=>total-paid();
  const finish=async()=>{if(busy)return;busy=true;try{await onPaid(pays);}catch(e){busy=false;toast("儲存失敗，請再試一次："+(e&&e.message||e));}};
  const draw=()=>{const rem=remain(),r=rem/100;
    const quick=[...new Set([Math.ceil(r/10)*10,Math.ceil(r/50)*50,Math.ceil(r/100)*100,Math.ceil(r/200)*200])].filter(x=>x>r).slice(0,4);

      <div class="sum big" style="color:var(--amber)"><span>尚欠 Due</span><span>${R(rem)}</span></div>
      <div class="f" style="margin-top:10px"><label>付款方式（按下即收款）Tap a method to pay</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${METHODS.map(([k,z,e])=>`<button class="btn ${k==="cash"?"ok":""}" data-act="pm" data-v="${k}" style="min-height:60px">${z}<small style="color:inherit;opacity:.8">${e}</small></button>`).join("")}</div></div>
      <div style="font-size:12px;color:var(--muted)">不輸入金額＝收剛好。輸入金額再按付款方式＝收該金額（現金自動算找零；分開付款就分次按）。</div>
    </div><div>
      <div class="disp" id="payDisp">${entry?"R"+esc(entry):`<span style="color:var(--muted);font-size:18px">剛好 Exact ${R(rem)}</span>`}</div>
      <div class="chips" style="margin-bottom:8px">${quick.map(q=>`<button class="chip" data-act="qk" data-v="${q}">R${q}</button>`).join("")}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="k" data-k="${n}">${n}</button>`).join("")}<button data-act="c">C</button><button data-act="k" data-k="0">0</button><button data-act="bk">⌫</button></div>
    </div></div><div class="foot"><button class="btn ghost" data-act="x">返回 Back</button></div>`,{
      k(el){if(entry.length<6){entry=(entry==="0"?"":entry)+el.dataset.k;draw();}},c(){entry="";draw();},bk(){entry=entry.slice(0,-1);draw();},
      qk(el){entry=el.dataset.v;draw();},
      rm(el){pays.splice(+el.dataset.i,1);draw();},
      x(){closeModal();},
      pm(el){const m=el.dataset.v,rem=remain();const amt=entry?parseInt(entry,10)*100:rem;
        if(!(amt>0)){toast("金額需大於 0");return;}
        if(m!=="cash"&&m!=="voucher"&&amt>rem){toast("非現金不能超收，請輸入不超過 "+R(rem));return;}
        const applied=Math.min(amt,rem);const p={method:m,amount:applied};if(m==="cash"&&amt>applied)p.tendered=amt;if(m==="voucher"&&amt>applied)p.face=amt;
        pays.push(p);entry="";if(remain()<=0)finish();else draw();}
    },true);};
  if(total<=0){finish();return;}
  draw();
}

const cartLines=(c,r)=>c.lines.map(l=>({itemId:l.itemId,code:l.code||"",catId:l.catId,name:l.name,nameEn:l.nameEn,price:l.price,qty:l.qty,mods:l.mods,note:l.note,disc:l.disc,r}));
async function createOrder(pays,t,open){
  const c=S.cart,now=Date.now(),dk=dkey(new Date(now));
  const todays=await DB.byDate(dk);const no=todays.reduce((m,o)=>Math.max(m,o.no||0),0)+1;
  const o={id:uid(),no,dateKey:dk,ts:now,type:c.type,source:c.source||S.settings.sources[0]||"",customer:c.customer.trim(),note:c.note.trim(),
    lines:cartLines(c,0),rounds:1,roundNotes:[],disc:c.disc,gross:t.gross,discTotal:t.disc,total:t.total,payments:pays,change:changeOf(pays),status:open?"open":"paid"};
  if(!open)o.paidAt=now;
  await DB.putOrder(o);return o;
}
async function appendOrder(o,pays,t){
  const c=S.cart,r=o.rounds||1;
  o.lines.push(...cartLines(c,r));o.rounds=r+1;o.gross+=t.gross;o.discTotal+=t.disc;o.total+=t.total;
  o.roundNotes=o.roundNotes||[];o.roundNotes[r]=c.note.trim();o.roundTs=o.roundTs||[];o.roundTs[r]=Date.now();
  if(pays&&pays.length){o.payments.push(...pays);o.change=(o.change||0)+changeOf(pays);}
  await DB.putOrder(o);return r;
}

   把原訂單載入點餐畫面修改；儲存時：未結帳的單直接更新；已結帳的單需店主 PIN 與原因，金額增加就補收、減少就退款。

const ensureLid=l=>{if(!l.lid)l.lid=uid();return l;};
const cp=x=>JSON.parse(JSON.stringify(x));
async function startEdit(o){
  if(o.status==="void"){toast("作廢的訂單不能修改");return;}
  if(o.status==="paid"&&!(await needPin()))return;
  if(S.months[ymOf(o.dateKey)]&&!(await confirmBox(`${ymLabel(ymOf(o.dateKey))}已經月結，修改後月報數字會變，之後需要重新月結。仍要修改？`,"仍要修改")))return;
  o.lines.forEach(ensureLid);
  if(S.cart.lines.length){S.held.push({id:uid(),ts:Date.now(),cart:S.cart});save.held();toast("目前這張已自動掛單");}
  S.cart=newCart();

    editOf:{id:o.id,no:o.no,status:o.status,customer:o.customer||"",origTotal:o.total,before:cp(o.lines),note:o.note||""}});
  save.cart();S.view="sell";S.unlocked=false;S.soMode=S.editMode=false;closeModal();render();
}
function diffLines(before,after){
  const out=[],bm=new Map(before.map(l=>[l.lid,l])),seen=new Set(),mods=l=>l.mods.map(m=>m.name).join("、");
  after.forEach(l=>{const b=l.lid&&bm.get(l.lid);
    if(!b){out.push({kind:"add",l});return;}seen.add(l.lid);
    if(b.qty!==l.qty||mods(b)!==mods(l)||(b.note||"")!==(l.note||""))out.push({kind:"chg",l,b});
    else if(JSON.stringify(b.disc||null)!==JSON.stringify(l.disc||null))out.push({kind:"price",l,b});});
  before.forEach(b=>{if(!seen.has(b.lid))out.push({kind:"del",l:b});});
  return out.map(c=>{const l=c.l;let t;
    if(c.kind==="add")t=`加 ${l.qty} x ${nm(l)}`;else if(c.kind==="del")t=`取消 ${l.qty} x ${nm(l)}`;
    else if(c.kind==="price")t=`${nm(l)} 折扣改為 ${discLabel(l.disc)||"無"}`;
    else{const p=[];if(c.b.qty!==l.qty)p.push(`數量 ${c.b.qty}→${l.qty}`);if(mods(c.b)!==mods(l))p.push(`客製 ${mods(l)||"無"}`);if((c.b.note||"")!==(l.note||""))p.push(`備註 ${l.note||"無"}`);t=`${nm(l)}：${p.join("，")}`;}
    return {...c,text:t};});
}
async function saveEdit(){
  const e=S.cart.editOf;if(!e)return;
  if(!S.cart.lines.length){toast("訂單不能是空的；整張不要了請到「訂單」按作廢");return;}
  const o=await DB.getOrder(e.id);
  if(!o||o.status==="void"){toast("找不到原訂單（可能已作廢），已取消修改");S.cart=newCart();save.cart();render();return;}
  const t=calc(S.cart),ch=diffLines(e.before,S.cart.lines),diff=t.total-o.total,c=S.cart;
  const info=[];if(c.type!==o.type)info.push(`取餐方式改為 ${c.type}`);if(c.customer.trim()!==(o.customer||""))info.push(`稱呼改為 ${c.customer.trim()||"無"}`);
  if(c.note.trim()!==(o.note||""))info.push(`整單備註改為 ${c.note.trim()||"無"}`);if(JSON.stringify(c.disc||null)!==JSON.stringify(o.disc||null))info.push(`整單折扣改為 ${discLabel(c.disc)||"無"}`);
  if(!ch.length&&!info.length&&diff===0){toast("沒有任何修改");return;}
  let reason="";
  if(o.status==="paid"){const r=await form(`修改已結帳的 ${ono(o)}`,[{k:"reason",label:"原因 Reason",type:"select",value:"客人改單 Customer changed",options:["客人改單 Customer changed","點錯 Wrong order","缺料換品項 Out of stock","補打折扣 Discount","其他 Other"].map(x=>[x,x])},{k:"more",label:"補充說明（選填）",type:"text",max:80}],"下一步 Next");
    if(!r)return;reason=r.reason+(r.more?"："+r.more:"");}
  const kitchenChanged=ch.some(x=>x.kind!=="price")||c.note.trim()!==(o.note||"")||c.type!==o.type;
  const apply=async pays=>{
    const before=o.total,lastR=Math.max(0,(o.rounds||1)-1);
    o.lines=c.lines.map(l=>({lid:l.lid||uid(),itemId:l.itemId,code:l.code||"",catId:l.catId,name:l.name,nameEn:l.nameEn,price:l.price,qty:l.qty,mods:l.mods,note:l.note,disc:l.disc,r:l.r==null?lastR:l.r}));
    Object.assign(o,{type:c.type,source:c.source||o.source,customer:c.customer.trim(),note:c.note.trim(),disc:c.disc,gross:t.gross,discTotal:t.disc,total:t.total});
    if(pays&&pays.length){o.payments.push(...pays);o.change=(o.change||0)+changeOf(pays);}
    o.edits=o.edits||[];o.edits.push({ts:Date.now(),status:o.status,reason,from:before,to:t.total,diff,changes:[...ch.map(x=>x.text),...info]});
    await DB.putOrder(o);await afterCommit();
    editDone(o,ch,info,diff,pays||[],kitchenChanged);
  };
  if(o.status==="paid"&&diff>0)payBox(diff,`補收差額 ${ono(o)}（${R(o.total)} → ${R(t.total)}）`,apply);
  else if(o.status==="paid"&&diff<0)refundBox(o,-diff,apply);
  else await apply(null);
}
function refundBox(o,amt,cb){

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${METHODS.map(([k,z,en])=>`<button class="btn ${paidBy.includes(k)?"ok":""}" data-act="m" data-v="${k}" style="min-height:60px">${z}<small style="color:inherit;opacity:.85">${en}${paidBy.includes(k)?" · 原付款方式":""}</small></button>`).join("")}</div>

function changeCanvas(o,ch,info){
  const rows=[{t:"✎ 修改單 CHANGE",size:40,bold:true,align:"center"},{t:"（照這張改，其他照原單）",size:20,align:"center"},{t:ono(o),size:64,bold:true,align:"center"},
    {t:o.type+" "+(TYPES.find(x=>x[0]===o.type)||["",""])[1],size:30,bold:true,align:"center"},{t:tstr(Date.now())+(o.customer?"  "+o.customer:""),size:24,align:"center"},{line:2}];
  const block=(title,list,fn)=>{if(!list.length)return;rows.push({t:title,size:30,bold:true});list.forEach(fn);rows.push({gap:6},{line:1});};
  const detail=l=>{if(l.nameEn)rows.push({t:"   "+l.nameEn,size:24,bold:true});l.mods.forEach(m=>rows.push({t:"   + "+m.name+(m.nameEn?" "+m.nameEn:""),size:26,bold:true}));if(l.note)rows.push({t:"   ※ "+l.note,size:26,bold:true});};
  block("✚ 加做 ADD",ch.filter(x=>x.kind==="add"),x=>{rows.push({t:x.l.qty+" x "+nm(x.l),size:32,bold:true});detail(x.l);});
  block("✖ 取消 CANCEL（不要做）",ch.filter(x=>x.kind==="del"),x=>{rows.push({t:x.l.qty+" x "+nm(x.l),size:32,bold:true});if(x.l.mods.length||x.l.note)rows.push({t:"   （"+[...x.l.mods.map(m=>m.name),x.l.note].filter(Boolean).join("、")+"）",size:22});});
  block("↻ 更改 CHANGE",ch.filter(x=>x.kind==="chg"),x=>{const d=x.l.qty-x.b.qty;rows.push({t:nm(x.l),size:30,bold:true});
    if(d)rows.push({t:`   數量 ${x.b.qty} → ${x.l.qty}（${d>0?"多做 "+d:"少做 "+(-d)} 份）`,size:28,bold:true});
    const ms=l=>l.mods.map(m=>m.name).join("、");if(ms(x.b)!==ms(x.l))rows.push({t:"   客製改為："+(ms(x.l)||"無"),size:26,bold:true});
    if((x.b.note||"")!==(x.l.note||""))rows.push({t:"   備註改為："+(x.l.note||"無"),size:26,bold:true});
    if(!d&&x.l.qty)rows.push({t:"   （共 "+x.l.qty+" 份）",size:22});});
  info.filter(t=>!/稱呼|折扣/.test(t)).forEach(t=>rows.push({t,size:26,bold:true}));
  rows.push({line:2},{gap:30});return ticket(rows);
}

/* ---------- 報表 ---------- */
function report(orders,dk){
  const ok=orders.filter(o=>o.status!=="void"&&o.status!=="open"),vd=orders.filter(o=>o.status==="void"),op=orders.filter(o=>o.status==="open");
  const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  const r={dk,count:ok.length,gross:sum(ok,o=>o.gross),disc:sum(ok,o=>o.discTotal),net:sum(ok,o=>o.total),voidCount:vd.length,voidTotal:sum(vd,o=>o.total),openCount:op.length,openTotal:sum(op,o=>o.total),methods:{},sources:{},types:{},items:{}};
  ok.forEach(o=>{o.payments.forEach(p=>{r.methods[p.method]=(r.methods[p.method]||0)+p.amount;});
    const a=(m,k)=>{m[k]=m[k]||{n:0,amt:0};m[k].n++;m[k].amt+=o.total;};a(r.sources,o.source||"—");a(r.types,o.type);
    o.lines.forEach(l=>{const x=lineCalc(l);const it=r.items[nm(l)]=r.items[nm(l)]||{en:l.nameEn,qty:0,amt:0};it.qty+=l.qty;it.amt+=x.net;});});
  const d=day(dk);r.float=d.float||0;r.cashSales=r.methods.cash||0;r.cashIn=sum(d.moves.filter(m=>m.amount>0),m=>m.amount);r.cashOut=-sum(d.moves.filter(m=>m.amount<0),m=>m.amount);
  r.expected=r.float+r.cashSales+r.cashIn-r.cashOut;r.counted=d.counted;r.diff=d.counted==null?null:d.counted-r.expected;r.moves=d.moves;r.closedAt=d.closedAt;
  return r;
}
function vReport(){return `<div class="tabs2"><button class="${S.rtab!=="month"?"on":""}" data-act="rtab" data-v="day">日報 Daily</button><button class="${S.rtab==="month"?"on":""}" data-act="rtab" data-v="month">月報 Monthly</button></div>`+(S.rtab==="month"?vMonth():vDay());}

  <h3>付款方式 By payment</h3><div class="cardb"><table><tr><th>方式</th><th class="n">金額</th></tr>${METHODS.map(([k])=>`<tr><td>${mName(k)}</td><td class="n">${R(r.methods[k]||0)}</td></tr>`).join("")}<tr><td><b>合計</b></td><td class="n"><b>${R(r.net)}</b></td></tr></table></div>
  <h3>現金對帳 Cash reconciliation</h3><div class="cardb"><table>
    <tr><td>開店備用金 Opening float</td><td class="n">${R(r.float)}</td></tr><tr><td>現金銷售 Cash sales</td><td class="n">${R(r.cashSales)}</td></tr>

function monthBanner(){
  const cur=ymOf(dkey()),pv=prevYm(cur),t=new Date();let h="";

  if(t.getDate()===daysIn(cur)&&S.date===dkey())h+=`<div class="tip" style="margin:0 0 10px;background:var(--blue);color:#fff">今天是 ${+cur.slice(5)} 月最後一天：收班點完錢後，到「月報 Monthly」按「月結」。明天起會自動開始新月份的統計。</div>`;
  return h;
}
function vMonth(){
  const r=S.mRep;if(!r)return `<div class="empty">載入中…</div>`;
  const st=S.months[r.ym],cur=ymOf(dkey());
  let status;
  if(st)status=`<div class="tip" style="margin:0 0 8px;background:var(--green);color:#fff">✔ 已於 ${dtstr(st.closedAt)} 月結（當時營業額 ${R(st.net)}、${st.count} 筆）</div>`+((st.net!==r.net||st.count!==r.count)?`<div class="tip" style="margin:0 0 8px">⚠ 月結後資料有變動，現在是 ${R(r.net)}、${r.count} 筆。如果是補登或作廢造成的，請按「重新月結」。</div>`:"");
  else if(r.ym<cur)status=`<div class="tip" style="margin:0 0 8px">這個月已經結束，還沒月結。確認資料無誤後按「月結」。</div>`;

  return `<h2>月報表 Monthly report · ${ymLabel(r.ym)}</h2>
    <div class="row" style="margin-bottom:10px"><input type="month" id="monthSel" value="${r.ym}" max="${cur}" style="width:200px" aria-label="月份"/><button class="btn ghost" style="padding:10px 14px" data-act="goMonth" data-v="${cur}">本月 This month</button></div>
    ${status}
    <div class="row" style="margin-bottom:14px"><button class="btn ${st?"":"pri"}" style="padding:12px 18px" data-act="monthClose">${st?"重新月結 Re-close":"月結 Close month"}</button><button class="btn" style="padding:12px 18px" data-act="prMonth">列印月結單</button><button class="btn" style="padding:12px 18px" data-act="expMonth">匯出月報（可列印／分享）</button><button class="btn" style="padding:12px 18px" data-act="csvDays">每日營業 CSV</button><button class="btn" style="padding:12px 18px" data-act="csvItems">每日品項 CSV</button></div>
    ${monthBody(r)}`;
}

/* ---------- 列印：畫成 384px 寬黑白圖（58mm 紙），交給 RawBT ---------- */
const PW=384,FONT='"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
function wrapText(ctx,text,maxW){
  const tokens=String(text).match(/[A-Za-z0-9R@#%&$.,:;!?()'"+\-\/]+|\s+|[^]/g)||[];const out=[];let cur="";
  for(const tk of tokens){
    if(ctx.measureText(cur+tk).width<=maxW){cur+=tk;continue;}
    if(cur.trim()){out.push(cur.trimEnd());cur="";}
    if(/^\s+$/.test(tk))continue;
    if(ctx.measureText(tk).width<=maxW){cur=tk;continue;}
    for(const ch of tk){if(ctx.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur="";}cur+=ch;}
  }
  if(cur.trim())out.push(cur.trimEnd());
  return out.length?out:[""];
}
/* rows: {t,r,size,bold,align} | {line:1} | {gap:n} */
function ticket(rows){
  const mc=document.createElement("canvas").getContext("2d"),P=4,ops=[];let y=10;
  const f=(s,b)=>`${b?"bold ":""}${s}px ${FONT}`;
  for(const r of rows){
    if(r.gap){y+=r.gap;continue;}
    if(r.line){ops.push({line:r.line,y:y+7});y+=16;continue;}
    const size=r.size||22,lh=Math.round(size*1.32);mc.font=f(size,r.bold);
    const rw=r.r?mc.measureText(r.r).width+12:0;
    wrapText(mc,r.t??"",PW-P*2-rw).forEach((ln,i)=>{ops.push({t:ln,y,font:f(size,r.bold),align:r.align||"left"});if(i===0&&r.r)ops.push({t:r.r,y,font:f(size,r.bold),align:"right"});y+=lh;});
  }
  const c=document.createElement("canvas");c.width=PW;c.height=y+16;const ctx=c.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#000";ctx.strokeStyle="#000";ctx.textBaseline="top";
  for(const o of ops){
    if(o.line){ctx.lineWidth=2;ctx.setLineDash(o.line===2?[]:[6,5]);ctx.beginPath();ctx.moveTo(P,o.y);ctx.lineTo(PW-P,o.y);ctx.stroke();continue;}
    ctx.font=o.font;ctx.textAlign=o.align;ctx.fillText(o.t,o.align==="center"?PW/2:o.align==="right"?PW-P:P,o.y);
  }
  return c;
}
function stack(list){
  const GAP=70,h=list.reduce((s,c)=>s+c.height,0)+GAP*(list.length-1);const c=document.createElement("canvas");c.width=PW;c.height=h;const ctx=c.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,PW,h);let y=0;
  list.forEach((x,i)=>{ctx.drawImage(x,0,y);y+=x.height;if(i<list.length-1){ctx.fillStyle="#000";ctx.font=`18px ${FONT}`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("✂ - - - - - - 撕開 TEAR - - - - - - ✂",PW/2,y+GAP/2);y+=GAP;}});
  return c;
}
function receiptCanvas(o){
  const s=S.settings,rows=[{t:s.shopName,size:36,bold:true,align:"center"}];
  if(s.shopEn)rows.push({t:s.shopEn,size:28,bold:true,align:"center"});
  if(s.addr)rows.push({t:s.addr,size:18,align:"center"});if(s.phone)rows.push({t:"Tel: "+s.phone,size:18,align:"center"});
  if(o.status==="void")rows.push({gap:6},{t:"*** 作廢 VOID ***",size:28,bold:true,align:"center"});
  if(o.status==="open")rows.push({gap:6},{t:"帳單 BILL · 未結帳 UNPAID",size:26,bold:true,align:"center"});
  rows.push({line:2},{t:ono(o)+"  "+o.type+" "+(TYPES.find(x=>x[0]===o.type)||["",""])[1],size:30,bold:true},{t:dtstr(o.ts),r:o.source,size:19});
  if(o.customer)rows.push({t:"稱呼 Name: "+o.customer,size:22,bold:true});
  rows.push({line:1});
  o.lines.forEach(l=>{const x=lineCalc(l);
    rows.push({t:nm(l)+" x"+l.qty,r:R(l.price*l.qty),size:23,bold:true});
    if(l.nameEn)rows.push({t:l.nameEn,size:22});
    l.mods.forEach(m=>rows.push({t:" + "+m.name+(m.nameEn?" "+m.nameEn:""),r:m.price?R(m.price*l.qty):"",size:21}));
    if(l.note)rows.push({t:" ※ "+l.note,size:19});
    if(x.disc)rows.push({t:" 折扣 Disc "+discLabel(l.disc),r:"-"+R(x.disc),size:19});
    rows.push({gap:4});});
  rows.push({line:1});
  if(o.discTotal){rows.push({t:"小計 Subtotal",r:R(o.gross),size:21});rows.push({t:"折扣 Discount",r:"-"+R(o.discTotal),size:21});}
  rows.push({t:"合計 TOTAL",r:R(o.total),size:30,bold:true},{gap:4});
  o.payments.forEach(p=>rows.push({t:(p.refund?"退款 Refund ":"")+mName(p.method),r:R(p.tendered||p.amount),size:21}));
  if(o.edits&&o.edits.length)rows.push({t:"（此單已修改 Edited "+dtstr(o.edits[o.edits.length-1].ts)+"）",size:18});
  if(o.change)rows.push({t:"找零 Change",r:R(o.change),size:21});
  if(allNotes(o))rows.push({line:1},{t:"備註 Note: "+allNotes(o),size:20});
  rows.push({line:2});if(s.footer)rows.push({t:s.footer,size:21,align:"center"});rows.push({gap:36});
  return ticket(rows);
}
const allNotes=o=>[o.note,...(o.roundNotes||[])].filter(Boolean).join(" / ");
/* round>0：只印那一輪加點的品項，最上面大字標「加點」 */
function kitchenCanvas(o,round){
  const r=round||0,lines=r?o.lines.filter(l=>(l.r||0)===r):o.lines,note=r?((o.roundNotes||[])[r]||""):allNotes(o);
  const rows=[];
  if(r)rows.push({t:"★ 加點 ADD-ON ★",size:40,bold:true,align:"center"},{t:"（只做這張單上的品項）",size:20,align:"center"});
  else rows.push({t:"廚房單 KITCHEN",size:24,bold:true,align:"center"});
  rows.push({t:ono(o),size:64,bold:true,align:"center"},{t:o.type+" "+(TYPES.find(x=>x[0]===o.type)||["",""])[1],size:32,bold:true,align:"center"},{t:tstr(r?((o.roundTs||[])[r]||Date.now()):o.ts)+(o.customer?"  "+o.customer:""),size:24,align:"center"});
  if(o.status==="void")rows.push({t:"*** 作廢 VOID ***",size:30,bold:true,align:"center"});
  rows.push({line:2});
  lines.forEach(l=>{rows.push({t:l.qty+" x "+nm(l)+(!r&&(l.r||0)?"（加點）":""),size:32,bold:true});if(l.nameEn)rows.push({t:"   "+l.nameEn,size:28,bold:true});
    l.mods.forEach(m=>rows.push({t:"   + "+m.name+(m.nameEn?" "+m.nameEn:""),size:26,bold:true}));
    if(l.note)rows.push({t:"   ※ "+l.note,size:26,bold:true});rows.push({gap:8});});
  if(note)rows.push({line:1},{t:"備註 Note: "+note,size:26,bold:true});
  rows.push({line:2},{gap:30});
  return ticket(rows);
}
function reportCanvas(r){
  const s=S.settings,rows=[{t:s.shopName+" "+s.shopEn,size:28,bold:true,align:"center"},{t:"日結單 Daily Report",size:24,bold:true,align:"center"},{t:r.dk,size:24,align:"center"},{t:"列印 "+dtstr(Date.now()),size:17,align:"center"},{line:2},
    {t:"營業額 Net sales",r:R(r.net),size:24,bold:true},{t:"訂單數 Orders",r:String(r.count),size:21},{t:"折扣 Discounts",r:R(r.disc),size:21},{t:"作廢 Voids",r:r.voidCount+" / "+R(r.voidTotal),size:21},{t:"未結帳 Unpaid",r:r.openCount+" / "+R(r.openTotal),size:21},{line:1}];
  METHODS.forEach(([k])=>rows.push({t:mName(k),r:R(r.methods[k]||0),size:21}));
  rows.push({line:1},{t:"備用金 Float",r:R(r.float),size:21},{t:"現金銷售 Cash sales",r:R(r.cashSales),size:21},{t:"現金存入 Cash in",r:R(r.cashIn),size:21},{t:"現金支出 Cash out",r:"-"+R(r.cashOut),size:21},{t:"錢箱應有 Expected",r:R(r.expected),size:23,bold:true},
    {t:"實際點錢 Counted",r:r.counted==null?"—":R(r.counted),size:21},{t:"差額 Variance",r:r.diff==null?"—":(r.diff>0?"+":"")+R(r.diff),size:23,bold:true},{line:1},{t:"來源 Sources",size:20,bold:true});
  Object.entries(r.sources).forEach(([k,v])=>rows.push({t:k+" ("+v.n+")",r:R(v.amt),size:20}));
  rows.push({line:1},{t:"品項 Items",size:20,bold:true});
  Object.entries(r.items).sort((a,b)=>b[1].qty-a[1].qty).forEach(([k,v])=>rows.push({t:k+" x"+v.qty,r:R(v.amt),size:20}));
  rows.push({line:2},{gap:36});return ticket(rows);
}
function printOrder(o,mode,round){const list=[];if(mode!=="receipt")list.push(kitchenCanvas(o,round));if(mode!=="kitchen")list.push(receiptCanvas(o));printCanvas(list.length>1?stack(list):list[0]);}
/* 轉成純黑白：出單機本來就只有黑白，而且 PNG 會小很多（交給 RawBT 的網址才不會太長） */
function toBW(c){const ctx=c.getContext("2d"),im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4){const v=(d[i]*3+d[i+1]*6+d[i+2])/10<150?0:255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  ctx.putImageData(im,0,0);return c;}
function printCanvas(c){
  const url=toBW(c).toDataURL("image/png");
  if(isAndroid){location.href="intent:"+url+"#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;";toast("已送到 RawBT 列印");return;}
  const prevMH=MH,prevHtml=$("#modal").classList.contains("on")?$("#modal").innerHTML:null;
  modal(`<h3>列印預覽 Print preview</h3><img class="prev" id="prevImg" alt="列印預覽" src="${url}" style="width:${PW/2}px"/><div style="font-size:13px;color:var(--muted);text-align:center">這台不是 Android 平板，所以只顯示預覽。平板上會直接送到 RawBT。</div><div class="foot"><button class="btn pri" data-act="x">關閉 Close</button></div>`,
    {x(){if(prevHtml){$("#modal").innerHTML=prevHtml;MH=prevMH;}else closeModal();}});
}

/* ---------- 啟動 ---------- */
(async function init(){
  try{
    await DB.open();
    const [st,menu,days,held,cart,months]=await Promise.all(["settings","menu","days","held","cart","months"].map(DB.get));S.months=months||{};
    S.settings={...DEF_SETTINGS,...(st||{})};S.menu=menu||seedMenu();S.days=days||{};S.held=held||[];
    if(cart&&Array.isArray(cart.lines))S.cart={...newCart(),...cart};
    if(ensureCodes()||!menu)await save.menu();if(!st)await save.settings();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(ok=>{S.persisted=ok;});
    await refreshOpen();
    render();
    if(!S.menu.appSyncedAt&&navigator.onLine!==false)syncFromApp(true).then(r=>{if(r&&S.view==="sell"&&!$("#modal").classList.contains("on"))render();});
  }catch(e){$("#app").innerHTML=`<div class="empty">無法開啟本機資料庫：${esc(e&&e.message||e)}<br/>請不要用無痕模式開啟，並確認瀏覽器允許儲存資料。</div>`;}
})();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
window.JWPOS={S,DB,calc,report,monthReport,loadReport,monthExportHtml,monthCanvas,receiptCanvas,kitchenCanvas,reportCanvas,stack};
</script>
